# Distress events for the EBA transparency-exercise sample (2014-12 .. 2025-06)
# Compiled 2026-11-21 against data/banks.csv (prod `eba`).
#
# Event definition (following the event-based approach of Betz et al., 2014,
# "Predicting distress in European banks"): a bank in the sample is in distress
# when one of the following public, dated, attributable events occurs:
#   - foltf:            declared "failing or likely to fail" (ECB / SRB), with or without resolution
#   - resolution:       resolution action or liquidation under national insolvency law
#   - state_support:    public recapitalisation, precautionary recapitalisation, impaired-asset
#                       measure or state-supported sale/liquidation decided by the State and
#                       assessed by the European Commission
#   - early_intervention: supervisory takeover (e.g. temporary administration)
#
# cause:  fundamental = deterioration of solvency, asset quality or profitability
#         exogenous   = triggered mainly by sanctions / AML / geopolitical action
# set:    primary     = used in the main evaluation (fundamental causes only)
#         sensitivity = added only in the sensitivity analysis
# status: included | excluded (excluded events are kept for transparency, with the reason)
#
# Eligibility: an event is evaluable only if the bank has at least one panel
# observation in the window of 1-4 quarters before the event date. With
# semi-annual data before 2018-09 the window contains at most two observations.

events:
  - event_id: ev_2016_hsh_state_aid
    bank_id: 24
    bank_lei: TUKDD90GPC79G1KOE162
    bank_name: Hamburg Commercial Bank AG (HSH Nordbank)
    event_date: "2016-05-02"
    event_type: state_support
    cause: fundamental
    set: primary
    status: included
    source: "European Commission Decision (EU) 2016/2057 of 2 May 2016 on State aid to HSH Nordbank (SA.29338); https://op.europa.eu/en/publication-detail/-/publication/2b8bea33-b2a0-11e6-9e3c-01aa75ed71a1/language-en"
    notes: "Owners' guarantee restored and impaired assets taken over by the Länder; condition: sale or wind-down by 2018. Window 201506-201603 -> observations 201506, 201512."

