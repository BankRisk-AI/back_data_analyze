# Events found in the sources but NOT evaluable or NOT matching the definition
excluded:
  - event: "2015 recapitalisations of Greek banks after the ECB comprehensive assessment (Piraeus, National Bank of Greece; Alpha and Eurobank largely private)"
    banks: [134, 123, 128, 135]
    reason: "Events coincide with the banks' first panel observation (201512): no pre-event history. Details to verify if cited."
  - event: "Caixa Geral de Depósitos recapitalisation by the Portuguese State, 2017"
    banks: [94]
    reason: "European Commission concluded no State aid (market economy investor); ambiguous as a distress event. Candidate for sensitivity only."
  - event: "Banco Mare Nostrum merged into Bankia (BFA), 2017-2018"
    banks: [43, 42]
    reason: "Merger between two State-owned banks under restructuring; ambiguous 'distressed merger'. Not used."
  - event: "Banca Monte dei Paschi capital increase with State participation, 2022"
    banks: [68]
    reason: "Continuation of the 2017 restructuring, not a new event; would double count MPS."
  - event: "Dexia (orderly resolution since 2011-2012) and DEPFA (wind-down entity)"
    banks: [8, 114]
    reason: "Wind-down entities throughout the sample, no discrete event in the window. Recommended: mark as specialist_institution (type wind_down)."
  - event: "Pre-2015 events (Banco Espírito Santo 2014, Bank of Cyprus 2013, Slovenian bank recapitalisations 2013-2014)"
    banks: []
    reason: "Before the data window."