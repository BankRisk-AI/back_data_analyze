  weights: unused
  null_input: not_evaluated
  specialist_institution:
    relative_rules: exclude
    composite_score: exclude
  series_break:
    trend: not_evaluated_if_comparison_touches_break
    threshold_scaling: false
  frequency:
    trend_4_periods: calendar_alignment
